name: Deploy StudyHub to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "studyhub/**"
      - ".github/workflows/static.yml"
      - ".github/workflows/deploy-studyhub.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare StudyHub website
        run: |
          mkdir -p _site
          cp -R studyhub/. _site/
      - name: Upload StudyHub artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: studyhub-pages
      - name: Deploy StudyHub
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: studyhub-pages
